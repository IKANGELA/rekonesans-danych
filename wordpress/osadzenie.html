<!-- ==================================================
     REKONESANS DANYCH – osadzenie na ikangela.pl
     Wklej w blok „Własny HTML” (Custom HTML) na podstronie WordPressa.
     Aplikacja działa z GitHub Pages; ta ramka tylko ją wyświetla.
     ================================================== -->
<div class="ika-rekonesans">
    <iframe
        id="ika-rekonesans-ramka"
        src="https://ikangela.github.io/rekonesans-danych/"
        title="Rekonesans danych – raport jakości pliku CSV i Excel"
        loading="lazy"
        referrerpolicy="no-referrer"></iframe>
</div>

<style>
.ika-rekonesans {
    max-width: 1100px;
    margin: 0 auto;
}
.ika-rekonesans iframe {
    display: block;
    width: 100%;
    height: 900px;           /* wysokość startowa – potem dopasowuje się sama */
    border: 0;
    background: #f8f7f5;
}
</style>

<script>
/* Ramka sama dopasowuje wysokość do treści aplikacji (bez podwójnego paska przewijania).
   Przyjmujemy wiadomości wyłącznie od aplikacji z ikangela.github.io i tylko liczbę. */
window.addEventListener("message", function (e) {
    if (e.origin !== "https://ikangela.github.io") return;
    var h = e.data && e.data.rekonesansWysokosc;
    if (typeof h === "number" && h > 200 && h < 30000) {
        document.getElementById("ika-rekonesans-ramka").style.height = h + "px";
    }
});
</script>
